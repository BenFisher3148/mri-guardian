[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-guardian-layer"
version = "0.1.0"
description = "ICSD-based verification proxy for raw MRI reconstruction AI handoff."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Benza Fisher" },
]
keywords = ["MRI", "verification", "ICSD", "DICOM", "PACS"]
dependencies = [
  "dpa-icsd[speed-numba]>=1.1,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
speed = [
  "dpa-icsd[speed-extensions]>=1.1,<2",
  "cython>=3,<4",
]
dev = [
  "dpa-icsd[speed-extensions]>=1.1,<2",
  "cython>=3,<4",
]

[project.scripts]
mri-guardian = "mri_guardian.cli:main"

[tool.setuptools.packages.find]
include = ["mri_guardian*"]
